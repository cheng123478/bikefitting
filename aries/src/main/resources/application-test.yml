server:
  port: 0
  servlet:
    context-path: /aries

spring:
  cache:
    type: simple
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:aries_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 1s
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

file:
  resource:
    location: ./resource/
    relative:
      path: /resource/**

txCloud:
  cos:
    uid: test
    region: ap-guangzhou
    secretId: test
    secretKey: test
    bucket: test

sms:
  base-url: http://localhost:8080/mock-sms
  key: test
  tpl-id: test

wechat:
  mini-program:
    app-id: test
    app-secret: test
  web:
    app-id: test
    app-secret: test

aries:
  security:
    jwt:
      key-id: test
      public-key:
      private-key:
    rsa:
      private-key:
  snowflake:
    worker-id: 1
    datacenter-id: 1
